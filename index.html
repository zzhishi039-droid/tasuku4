<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasuku Board - カンバン＆ポモドーロ管理</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="app" class="max-w-7xl mx-auto px-4 py-6">
    
    <!-- ヘッダー -->
    <header class="flex flex-col lg:flex-row items-center justify-between pb-6 border-b border-slate-200 dark:border-slate-800 gap-4">
      <div class="flex items-center gap-3 w-full lg:w-auto justify-between lg:justify-start">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-500/20">
            <i data-lucide="layout-dashboard" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="text-xl font-bold tracking-tight leading-none text-indigo-600 dark:text-indigo-400">Tasuku Board</h1>
            <span class="text-[10px] font-bold text-slate-400 tracking-wider">KANBAN & POMODORO</span>
          </div>
        </div>

        <!-- スマホ用右端ボタン群 -->
        <div class="flex items-center gap-2 lg:hidden">
          <button id="themeToggleMobile" class="p-2 text-slate-500 dark:text-slate-400 rounded-xl hover:bg-slate-200 dark:hover:bg-slate-800">
            <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
          </button>
        </div>
      </div>

      <!-- 中央：ポモドーロタイマーウィジェット -->
      <div class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 px-4 py-2 rounded-2xl shadow-sm flex items-center gap-4 w-full lg:w-auto justify-between sm:justify-center">
        <div class="flex items-center gap-2">
          <span id="pomoModeBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400">🍅 集中モード</span>
          <span id="pomoTimerDisplay" class="text-2xl font-mono font-bold tracking-wider">25:00</span>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="pomoStartBtn" onclick="togglePomodoro()" class="p-2 bg-rose-500 hover:bg-rose-600 active:bg-rose-700 text-white rounded-xl transition shadow-sm">
            <i id="pomoIcon" data-lucide="play" class="w-4 h-4"></i>
          </button>
          <button onclick="resetPomodoro()" class="p-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 右端操作 -->
      <div class="hidden lg:flex items-center gap-3">
        <button id="themeToggle" class="p-2.5 text-slate-500 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 rounded-xl transition">
          <i data-lucide="moon" class="w-5 h-5 dark:hidden"></i>
          <i data-lucide="sun" class="w-5 h-5 hidden dark:block"></i>
        </button>
        <button onclick="openModal()" class="flex items-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs px-4 py-2.5 rounded-xl transition shadow-md shadow-indigo-500/20">
          <i data-lucide="plus" class="w-4 h-4"></i> タスクを追加
        </button>
      </div>
    </header>

    <!-- 検索 & レーン用モバイル追加ボタン -->
    <div class="my-4 flex items-center justify-between gap-3">
      <div class="relative flex-1 max-w-sm">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
        <input type="text" id="searchInput" oninput="render()" placeholder="ボード内を検索..." class="w-full pl-9 pr-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>
      <button onclick="openModal()" class="lg:hidden flex items-center gap-1 bg-indigo-600 text-white text-xs px-3 py-2 rounded-xl font-semibold">
        <i data-lucide="plus" class="w-4 h-4"></i> 追加
      </button>
    </div>

    <!-- カンバンボード領域 (3カラム) -->
    <main class="grid grid-cols-1 md:grid-cols-3 gap-5 items-start">
      
      <!-- レーン 1: 未着手 (To Do) -->
      <div class="bg-slate-200/60 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-blue-500"></span>
            <h3 class="text-sm font-bold">未着手 (To Do)</h3>
            <span id="countTodo" class="px-2 py-0.5 rounded-full bg-slate-300 dark:bg-slate-700 text-[10px] font-bold">0</span>
          </div>
          <button onclick="openModal('todo')" class="p-1 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg text-slate-500 transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div id="columnTodo" class="space-y-3 flex-1"></div>
      </div>

      <!-- レーン 2: 進行中 (In Progress) -->
      <div class="bg-slate-200/60 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-amber-500"></span>
            <h3 class="text-sm font-bold">進行中 (In Progress)</h3>
            <span id="countDoing" class="px-2 py-0.5 rounded-full bg-slate-300 dark:bg-slate-700 text-[10px] font-bold">0</span>
          </div>
          <button onclick="openModal('doing')" class="p-1 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg text-slate-500 transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div id="columnDoing" class="space-y-3 flex-1"></div>
      </div>

      <!-- レーン 3: 完了 (Done) -->
      <div class="bg-slate-200/60 dark:bg-slate-800/60 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/50 flex flex-col min-h-[500px]">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-300/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
            <h3 class="text-sm font-bold">完了 (Done)</h3>
            <span id="countDone" class="px-2 py-0.5 rounded-full bg-slate-300 dark:bg-slate-700 text-[10px] font-bold">0</span>
          </div>
          <button onclick="openModal('done')" class="p-1 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-lg text-slate-500 transition"><i data-lucide="plus" class="w-4 h-4"></i></button>
        </div>
        <div id="columnDone" class="space-y-3 flex-1"></div>
      </div>

    </main>
  </div>

  <!-- タスク作成・編集モーダル -->
  <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 dark:border-slate-700">
      <div class="flex items-center justify-between mb-4">
        <h3 id="modalTitleText" class="text-base font-bold">新しいカードを追加</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="taskForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <input type="hidden" id="editTaskId">
        
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">タイトル *</label>
          <input type="text" id="taskTitle" required placeholder="タスク名を入力..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">ステータス</label>
            <select id="taskStatus" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
              <option value="todo">未着手 (To Do)</option>
              <option value="doing">進行中 (In Progress)</option>
              <option value="done">完了 (Done)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-500 mb-1">優先度</label>
            <select id="taskPriority" class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
              <option value="high">🔴 高</option>
              <option value="medium" selected>🟡 中</option>
              <option value="low">🔵 低</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">タグ（コンマ区切り）</label>
          <input type="text" id="taskTags" placeholder="デザイン, 設計, 開発..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1">詳細メモ</label>
          <textarea id="taskDesc" rows="3" placeholder="カードの詳細情報..." class="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs focus:outline-none"></textarea>
        </div>

        <div class="flex justify-end gap-2 pt-2 border-t border-slate-100 dark:border-slate-700">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-xs font-medium text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl transition">キャンセル</button>
          <button type="submit" class="px-4 py-2 text-xs font-semibold bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition">保存する</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // --- データ保存 & 状態 ---
    let tasks = JSON.parse(localStorage.getItem('tasuku_board_tasks') || '[]');
    
    // 初期描画
    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      render();
    });

    // --- テーマ設定 ---
    function initTheme() {
      if (localStorage.getItem('tasuku_theme') === 'dark' || (!('tasuku_theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    }
    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
      localStorage.setItem('tasuku_theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
    }
    document.getElementById('themeToggle').addEventListener('click', toggleTheme);
    document.getElementById('themeToggleMobile').addEventListener('click', toggleTheme);

    function saveTasks() {
      localStorage.setItem('tasuku_board_tasks', JSON.stringify(tasks));
      render();
    }

    // --- モーダル制御 ---
    function openModal(defaultStatus = 'todo', taskId = null) {
      const modal = document.getElementById('taskModal');
      const form = document.getElementById('taskForm');
      form.reset();

      if (taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
          document.getElementById('modalTitleText').textContent = "カードの編集";
          document.getElementById('editTaskId').value = task.id;
          document.getElementById('taskTitle').value = task.title;
          document.getElementById('taskStatus').value = task.status;
          document.getElementById('taskPriority').value = task.priority;
          document.getElementById('taskTags').value = (task.tags || []).join(', ');
          document.getElementById('taskDesc').value = task.desc || '';
        }
      } else {
        document.getElementById('modalTitleText').textContent = "新しいカードを追加";
        document.getElementById('editTaskId').value = '';
        document.getElementById('taskStatus').value = defaultStatus;
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      const modal = document.getElementById('taskModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // --- タスク保存フォーム ---
    function handleFormSubmit(e) {
      e.preventDefault();
      const editId = document.getElementById('editTaskId').value;
      const title = document.getElementById('taskTitle').value.trim();
      const status = document.getElementById('taskStatus').value;
      const priority = document.getElementById('taskPriority').value;
      const tagsRaw = document.getElementById('taskTags').value;
      const desc = document.getElementById('taskDesc').value.trim();

      const tags = tagsRaw ? tagsRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

      if (editId) {
        tasks = tasks.map(t => t.id === editId ? { ...t, title, status, priority, tags, desc } : t);
      } else {
        tasks.unshift({
          id: Date.now().toString(),
          title,
          status,
          priority,
          tags,
          desc,
          pomoCount: 0,
          createdAt: new Date().toISOString()
        });
      }
      saveTasks();
      closeModal();
    }

    // --- ステータス移動 ---
    function moveTask(id, targetStatus) {
      tasks = tasks.map(t => t.id === id ? { ...t, status: targetStatus } : t);
      saveTasks();
    }

    function deleteTask(id) {
      if (confirm('このカードを削除しますか？')) {
        tasks = tasks.filter(t => t.id !== id);
        saveTasks();
      }
    }

    // --- カンバンレンダリング ---
    function render() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      
      const filtered = tasks.filter(t => 
        t.title.toLowerCase().includes(search) || 
        (t.desc && t.desc.toLowerCase().includes(search)) ||
        (t.tags && t.tags.some(tag => tag.toLowerCase().includes(search)))
      );

      const todoList = filtered.filter(t => t.status === 'todo');
      const doingList = filtered.filter(t => t.status === 'doing');
      const doneList = filtered.filter(t => t.status === 'done');

      document.getElementById('countTodo').textContent = todoList.length;
      document.getElementById('countDoing').textContent = doingList.length;
      document.getElementById('countDone').textContent = doneList.length;

      document.getElementById('columnTodo').innerHTML = renderColumnCards(todoList, 'todo');
      document.getElementById('columnDoing').innerHTML = renderColumnCards(doingList, 'doing');
      document.getElementById('columnDone').innerHTML = renderColumnCards(doneList, 'done');

      lucide.createIcons();
    }

    function renderColumnCards(cardList, columnType) {
      if (cardList.length === 0) {
        return `<div class="h-24 flex items-center justify-center border-2 border-dashed border-slate-300/60 dark:border-slate-700/60 rounded-xl text-xs text-slate-400">カードはありません</div>`;
      }

      return cardList.map(t => {
        const priorityBadge = t.priority === 'high' ? '<span class="w-2 h-2 rounded-full bg-red-500" title="優先度: 高"></span>' :
                              t.priority === 'medium' ? '<span class="w-2 h-2 rounded-full bg-amber-500" title="優先度: 中"></span>' :
                              '<span class="w-2 h-2 rounded-full bg-blue-500" title="優先度: 低"></span>';

        return `
          <div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm hover:shadow transition group">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-1.5 flex-1">
                ${priorityBadge}
                <h4 class="text-xs font-bold text-slate-800 dark:text-slate-100 ${t.status === 'done' ? 'line-through text-slate-400 dark:text-slate-500' : ''}">${escapeHtml(t.title)}</h4>
              </div>
              <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition">
                <button onclick="openModal('${columnType}', '${t.id}')" class="p-1 text-slate-400 hover:text-indigo-500"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                <button onclick="deleteTask('${t.id}')" class="p-1 text-slate-400 hover:text-rose-500"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>

            ${t.desc ? `<p class="text-[11px] text-slate-500 dark:text-slate-400 mt-1.5 line-clamp-2">${escapeHtml(t.desc)}</p>` : ''}

            ${t.tags && t.tags.length > 0 ? `
              <div class="flex flex-wrap gap-1 mt-2">
                ${t.tags.map(tag => `<span class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700/80 text-slate-600 dark:text-slate-300 text-[9px] font-medium">#${escapeHtml(tag)}</span>`).join('')}
              </div>
            ` : ''}

            <!-- カード下部：レーン移動ボタン -->
            <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-100 dark:border-slate-700/50 text-[10px]">
              <div class="text-slate-400 flex items-center gap-1">
                <i data-lucide="clock" class="w-3 h-3"></i> ${new Date(t.createdAt).toLocaleDateString('ja-JP')}
              </div>
              <div class="flex items-center gap-1">
                ${columnType !== 'todo' ? `<button onclick="moveTask('${t.id}', '${columnType === 'done' ? 'doing' : 'todo'}')" class="px-2 py-1 rounded bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-600 dark:text-slate-300 font-medium">← 戻す</button>` : ''}
                ${columnType !== 'done' ? `<button onclick="moveTask('${t.id}', '${columnType === 'todo' ? 'doing' : 'done'}')" class="px-2 py-1 rounded bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-300 hover:bg-indigo-100 font-semibold">進める →</button>` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- ポモドーロタイマー機能 ---
    let pomoSeconds = 25 * 60;
    let pomoInterval = null;
    let isWorkMode = true;

    function togglePomodoro() {
      if (pomoInterval) {
        pausePomodoro();
      } else {
        startPomodoro();
      }
    }

    function startPomodoro() {
      pomoInterval = setInterval(() => {
        pomoSeconds--;
        updatePomodoroDisplay();
        if (pomoSeconds <= 0) {
          playBeep();
          clearInterval(pomoInterval);
          pomoInterval = null;
          isWorkMode = !isWorkMode;
          pomoSeconds = isWorkMode ? 25 * 60 : 5 * 60;
          
          const badge = document.getElementById('pomoModeBadge');
          if (isWorkMode) {
            badge.textContent = "🍅 集中モード";
            badge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400";
          } else {
            badge.textContent = "☕ 休憩モード";
            badge.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40 dark:text-emerald-400";
          }
          updatePomodoroDisplay();
          document.getElementById('pomoIcon').setAttribute('data-lucide', 'play');
          lucide.createIcons();
        }
      }, 1000);

      document.getElementById('pomoIcon').setAttribute('data-lucide', 'pause');
      lucide.createIcons();
    }

    function pausePomodoro() {
      clearInterval(pomoInterval);
      pomoInterval = null;
      document.getElementById('pomoIcon').setAttribute('data-lucide', 'play');
      lucide.createIcons();
    }

    function resetPomodoro() {
      pausePomodoro();
      isWorkMode = true;
      pomoSeconds = 25 * 60;
      document.getElementById('pomoModeBadge').textContent = "🍅 集中モード";
      document.getElementById('pomoModeBadge').className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-600 dark:bg-rose-900/40 dark:text-rose-400";
      updatePomodoroDisplay();
    }

    function updatePomodoroDisplay() {
      const mins = Math.floor(pomoSeconds / 60);
      const secs = pomoSeconds % 60;
      document.getElementById('pomoTimerDisplay').textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // Web Audio APIによる電子音通知（外部音声ファイル不要）
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch(e){}
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
    }
  </script>
</body>
</html>
